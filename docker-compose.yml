version: '3.8'

services:
  # Backend API Service
  backend:
    build: .
    container_name: coursesummary-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    volumes:
      - ./temp:/tmp/videos:rw
      - ./logs:/app/logs:rw
    networks:
      - coursesummary-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis

  # Frontend Streamlit Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: coursesummary-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    networks:
      - coursesummary-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # Redis Cache Service (optional - can use Redis Cloud instead)
  redis:
    image: redis:7-alpine
    container_name: coursesummary-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coursesummary-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:

networks:
  coursesummary-network:
    driver: bridge